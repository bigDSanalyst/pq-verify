# .github/workflows/pq-verify.yml
#
# Drop this into any repository that builds an ML-KEM or ML-DSA implementation.
# Findings appear as annotations on the pull request, and the build fails if the
# transform diverges from the FIPS 203/204 reference.

name: Post-quantum verification

on: [push, pull_request]

permissions:
  contents: read
  security-events: write      # required to upload SARIF to code scanning

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build whatever exposes your NTT symbol
      - name: Build
        run: |
          gcc -O3 -fPIC -shared -I. -o build/libmlkem768.so src/ntt.c src/reduce.c

      - name: Verify against FIPS 203/204
        uses: bigDSanalyst/pq-verify@v1
        with:
          library: build/libmlkem768.so
          symbol: PQCLEAN_MLKEM768_CLEAN_ntt
          fail-on-finding: 'true'

  # ACVP only — no library needed
  acvp:
    runs-on: ubuntu-latest
    steps:
      - uses: bigDSanalyst/pq-verify@v1
