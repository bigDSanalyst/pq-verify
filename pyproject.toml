[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pq-verify"
version = "2.10.0"
description = "Independent verification for ML-KEM / ML-DSA / SLH-DSA / LMS / XMSS implementations — vendor-library audits, fresh ACVP prompts, NIST ACVP, Coq proofs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nicholas Maino", email = "maiknown@gmail.com" },
]
keywords = [
    "post-quantum", "cryptography", "ML-KEM", "ML-DSA", "Kyber", "Dilithium",
    "FIPS-203", "FIPS-204", "FIPS-205", "SLH-DSA", "LMS", "XMSS", "SP-800-208",
    "NIST", "ACVP", "NTT", "verification", "lattice",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Security :: Cryptography",
]
dependencies = []

# ML-DSA ACVP needs dilithium-py; ML-KEM ACVP needs kyber-py; SLH-DSA ACVP needs
# slh-dsa (all optional, in [full])

[project.optional-dependencies]
# Required to reproduce the 1566/1566 ACVP claim (ML-KEM 240 + ML-DSA 615 +
# SLH-DSA 624; LMS 87 needs nothing beyond hashlib) and
# the live KEM roundtrip. sympy is required for the Engine-6 Conjecture 7
# exact-rational residue test; without it that check is reported SKIPPED
# (the self-suite total stays 160).
full = ["kyber-py", "dilithium-py", "sympy", "slh-dsa"]
# Developer tooling.
dev = ["pytest>=7.0", "kyber-py", "dilithium-py", "sympy", "slh-dsa"]

[project.urls]
Homepage = "https://github.com/bigDSanalyst/pq-verify"
Repository = "https://github.com/bigDSanalyst/pq-verify"
"Zenodo DOI" = "https://doi.org/10.5281/zenodo.19302050"

[project.scripts]
pq-verify = "pq_verify.cli:main"

[tool.setuptools]
packages = ["pq_verify", "pq_verify.vectors"]
include-package-data = true

[tool.setuptools.package-data]
pq_verify = ["vectors/*.gz", "vectors/*.json", "vectors/*.md", "coq/*.v", "harness/*.c",
             "harness/hbs/*.c", "harness/hbs/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises the full engine stack end to end (~45s)",
]
