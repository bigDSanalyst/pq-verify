# Keeps the CI actions current. A verification tool's own supply chain should
# not be the weakest link in it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # A release is proposed only once it is a week old: a compromised version
    # is usually caught and pulled within days, before a pin moves to it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
