name: LMS/XMSS full (weekly)

# Every LMS and XMSS tree of height 10 or less, built and signed byte-exactly
# against the pinned non-NIST vectors (pq-verify --lms-xmss-full). Building a
# tree costs up to a few million hash calls in pure Python, so the default
# --lms-xmss runs a smaller budget on every push and this runs the rest weekly,
# on changes to the implementation or the vectors, and on demand.

on:
  pull_request:
    paths:
      - "pq_verify/hbs.py"
      - "pq_verify/hbs_suite.py"
      - "pq_verify/vectors/hbs_vectors.json.gz"
      - "pq_verify/vectors/HBS_MANIFEST.json"
      - ".github/workflows/lms-xmss-full.yml"
  schedule:
    - cron: "45 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: LMS/XMSS, every height-10 tree
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: LMS/HSS + XMSS/XMSS^MT, full budget
        run: python -m pq_verify.cli --lms-xmss-full --fail-on-finding
