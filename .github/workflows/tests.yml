# The suite that was missing when 2.6.7 shipped a >=3.8 claim that was false on
# every Python below 3.12. Nothing ran the tests, so nothing caught it.
#
# The matrix covers the ENTIRE range pyproject declares. If a version is listed
# in requires-python it is exercised here; if it cannot be exercised here, the
# floor moves rather than the claim.
name: tests

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # The reference implementations the ACVP checks compare against.
          # Not best-effort: a version where these cannot install is a version
          # where the documented `pq-verify[full]` install does not work, and
          # that is exactly what the floor is supposed to mean.
          pip install kyber-py dilithium-py sympy

      - name: Test suite
        run: python -m pytest tests/ -q

      - name: Self-suite (smoke — must not crash)
        run: python -m pq_verify.cli --quick

      - name: NIST ACVP — 855 pinned vectors, offline
        run: python -m pq_verify.cli --acvp-all --fail-on-finding

  wheel:
    name: wheel installs and runs at the floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"        # the declared floor, end to end
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install "$(ls dist/*.whl)"
          /tmp/fresh/bin/pq-verify --version
      - name: The wheel must carry the pinned vectors
        run: |
          # A wheel that builds without them installs cleanly and then fails
          # every offline verification at runtime.
          /tmp/fresh/bin/pq-verify --emit-prompt ML-KEM-512 --prompt-out /tmp/p.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/p.json"))
          assert d["questionCount"] == 80, d["questionCount"]
          assert "pinned" in d["vectorSource"], d["vectorSource"]
          print("vectors present:", d["questionCount"], "questions from", d["vectorSource"])
          PY
