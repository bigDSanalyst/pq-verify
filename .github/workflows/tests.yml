# The suite that was missing when 2.6.7 shipped a >=3.8 claim that was false on
# every Python below 3.12. Nothing ran the tests, so nothing caught it.
#
# The matrix covers the ENTIRE range pyproject declares. If a version is listed
# in requires-python it is exercised here; if it cannot be exercised here, the
# floor moves rather than the claim.
name: tests

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # The reference implementations the ACVP checks compare against.
          # Not best-effort: a version where these cannot install is a version
          # where the documented `pq-verify[full]` install does not work, and
          # that is exactly what the floor is supposed to mean.
          pip install -c constraints-reference.txt kyber-py dilithium-py sympy slh-dsa

      - name: Test suite
        run: python -m pytest tests/ -q

      - name: Self-suite (smoke — must not crash)
        run: python -m pq_verify.cli --quick

      - name: NIST ACVP — 1566 pinned vectors, offline
        run: |
          python -m pq_verify.cli --acvp-all --fail-on-finding --json /tmp/acvp.json
          # --fail-on-finding passes a suite that could not run (its gate is
          # --require-full-coverage, which also wants coq); all four must have.
          python -c "import json; d = json.load(open('/tmp/acvp.json')); s = d['suites']; assert all(v['ran'] for v in s.values()) and len(s) == 4, s; print(d['summary'])"

      # The suite above scored 240/240 on the malformed vectors 2.8.0 shipped;
      # only the doctor's structural checks catch that class of defect.
      - name: Pinned vectors are sound (doctor, offline)
        run: python tools/doctor.py

      - name: LMS/HSS + XMSS/XMSS^MT, default budget
        run: python -m pq_verify.cli --lms-xmss --fail-on-finding
      - name: FN-DSA (draft track) — PQClean vectors, rejections, native NTT
        run: python -m pq_verify.cli --fndsa
      - name: Classic McEliece (not FIPS) — reference regenerates every KAT, ten sets
        run: python -m pq_verify.cli --mceliece
      - name: HQC code layer (standard not final) — reference vs the submitters' decoders
        run: python -m pq_verify.cli --hqc

      - name: Hybrid (RFC 10024) — prompt emits and round-trips
        run: |
          python -m pq_verify.cli --emit-hybrid-prompt list
          python -m pq_verify.cli --emit-hybrid-prompt X25519MLKEM768 \
            --prompt-out /tmp/hybrid-prompt.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/hybrid-prompt.json"))
          assert d["schema"] == "pq-verify/hybrid-prompt", d["schema"]
          assert d["codepoint"] == "0x11EC", d["codepoint"]
          assert d["specification"] == "RFC 10024", d["specification"]
          # the client share must be ML-KEM first for this group; that
          # reversal is the whole reason this check exists
          first = d["fields"]["clientShare"]["layout"][0]
          assert first["component"] == "kem_ek", first
          assert first["bytes"] == 1184, first
          print("hybrid prompt ok:", d["group"], d["codepoint"])
          PY

      - name: An unparseable transcript must not exit 0 under a gate
        run: |
          printf '{' > /tmp/bad-transcript.json
          if python -m pq_verify.cli --verify-hybrid /tmp/bad-transcript.json \
               --fail-on-finding; then
            echo "FAIL: a transcript that could not be parsed passed the gate"
            exit 1
          fi
          echo "cannot-verify correctly failed the gate"

  # The matrix above installs every Python extra and never installs coq, so
  # two paths never ran in CI: a missing optional dependency, and every
  # optional dependency present. Both hid real bugs -- a missing coq, and later
  # a missing kyber-py, each deleted checks or reported them as failures, and
  # the documented total was wrong for anyone whose install differed from CI's.
  #
  # Each profile runs the full self-suite and asserts the same four things:
  # the total is the documented 160; nothing failed; every skip names the
  # dependency it needed; and the set of missing dependencies is EXACTLY the
  # set this profile leaves out -- so a new check that silently vanishes, a
  # new undeclared dependency, or an absence reported as a failure all fail
  # the job the day they are introduced.
  self-suite:
    name: self-suite (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: base
            extras: ""
            apt: ""
            missing: "coq,cryptominisat,dilithium-py,kyber-py,slh-dsa,sympy"
          - profile: dev
            extras: "[dev]"
            apt: ""
            missing: "coq,cryptominisat"
          - profile: full
            extras: "[dev]"
            apt: "coq cryptominisat"
            missing: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: System dependencies
        if: matrix.apt != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.apt }}

      - name: Install (${{ matrix.profile }})
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-reference.txt ".${{ matrix.extras }}" pytest

      - name: Test suite (not slow)
        run: python -m pytest tests/ -q -m "not slow"

      - name: Self-suite — 160 checks, 0 failed, only the expected deps missing
        env:
          PROFILE: ${{ matrix.profile }}
          EXPECT_MISSING: ${{ matrix.missing }}
        run: |
          python - <<'PY'
          import contextlib, io, os, sys
          from pq_verify.core import main, DEGRADED
          EXPECTED_TOTAL = 160
          profile = os.environ["PROFILE"]
          expected = set(filter(None, os.environ["EXPECT_MISSING"].split(",")))
          with contextlib.redirect_stdout(io.StringIO()):
              results = main()
          rows = [t for r in results for t in r.tests]
          skipped = [t for t in rows if t.get("skipped")]
          failed = [t["name"] for t in rows
                    if not t.get("skipped") and t["passed"] is not True]
          unnamed = [t["name"] for t in skipped if not t.get("dep")]
          missing = set(DEGRADED["deps"])
          print(f"[{profile}] total={len(rows)} "
                f"passed={len(rows) - len(failed) - len(skipped)} "
                f"skipped={len(skipped)} failed={len(failed)} "
                f"missing={sorted(missing)}")
          problems = []
          if len(rows) != EXPECTED_TOTAL:
              problems.append(f"check count is {len(rows)}, documented {EXPECTED_TOTAL}")
          if failed:
              problems.append(f"failed checks: {failed}")
          if unnamed:
              problems.append(f"skips that name no dependency: {unnamed}")
          if missing != expected:
              problems.append(f"missing deps {sorted(missing)} != expected {sorted(expected)}")
          for p in problems:
              print(f"::error title=self-suite [{profile}]::{p}")
          sys.exit(1 if problems else 0)
          PY

  # macOS: Mach-O symbols (nm -gU, leading underscore), dyld instead of
  # /proc for the loaded-object binding, Apple clang for the engines. Until
  # this job passes, the package declares Linux only.
  macos:
    name: macOS (Apple silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-reference.txt ".[dev]" pytest
      - name: Engine builds (a failure is annotated with the compiler's words)
        run: |
          python - <<'PY'
          import contextlib, io
          from pq_verify import core
          with contextlib.redirect_stdout(io.StringIO()):
              core.compile_all(); core.compile_engine6()
          for name, why in core.ENGINE_ERRORS.items():
              msg = why.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::warning title=engine {name} did not build::{msg}")
          print("engines unavailable:", sorted(core.ENGINE_ERRORS) or "none")
          for so, info in sorted(core.ENGINE_FLAGS.items()):
              lost = info["native_requested"] and not info["native"]
              print(f"::{'warning' if lost else 'notice'} title=engine {so}::built with "
                    f"{info['flags']}" + (" -- native CPU tuning refused by the compiler"
                                          if lost else ""))
          PY
      - name: Test suite (not slow)
        if: success() || failure()
        run: python -m pytest tests/ -q -m "not slow" --junitxml="$RUNNER_TEMP/junit.xml"
      - name: Failing tests as annotations
        if: failure()
        run: python tools/ci_annotate.py "$RUNNER_TEMP/junit.xml"
      - name: NIST ACVP — 1566 pinned vectors
        if: success() || failure()
        run: |
          python -m pq_verify.cli --acvp-all --json "$RUNNER_TEMP/acvp.json"
          python -c "import json,os; d = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'acvp.json'))); s = d['suites']; assert all(v['ran'] for v in s.values()) and len(s) == 4, s; print(d['summary'])"
      - name: LMS/HSS + XMSS/XMSS^MT, default budget
        if: success() || failure()
        run: python -m pq_verify.cli --lms-xmss
      - name: FN-DSA (draft track), native NTT on Apple clang
        if: success() || failure()
        run: python -m pq_verify.cli --fndsa
      - name: Self-suite (quick, gated)
        if: success() || failure()
        run: python -m pq_verify.cli --quick

  wheel:
    name: wheel installs and runs at the floor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"        # the declared floor, end to end
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install "$(ls dist/*.whl)"
          /tmp/fresh/bin/pq-verify --version
      - name: The wheel must carry the pinned vectors
        run: |
          # A wheel that builds without them installs cleanly and then fails
          # every offline verification at runtime.
          /tmp/fresh/bin/pq-verify --emit-prompt ML-KEM-512 --prompt-out /tmp/p.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/p.json"))
          assert d["questionCount"] == 80, d["questionCount"]
          assert "pinned" in d["vectorSource"], d["vectorSource"]
          print("vectors present:", d["questionCount"], "questions from", d["vectorSource"])
          PY
      - name: The wheel must carry the pinned edge-case vectors
        run: |
          /tmp/fresh/bin/python - <<'PY'
          from pq_verify.edge import kem_cases, dsa_cases, sources
          n = len(kem_cases("ML-KEM-768")) + len(dsa_cases("ML-DSA-65"))
          assert n > 1500, n
          print("edge vectors present:", n, "cases from", sources())
          PY
      - name: The wheel must carry the SLH-DSA signature vectors
        run: |
          /tmp/fresh/bin/python - <<'PY'
          import os
          from pq_verify.core import _load_vector_json, _pkg_dir, _vector_revision
          n = 0
          for mode, want in (("sigVer", 504), ("sigGen", 624)):
              d = f"SLH-DSA-{mode}-FIPS205"
              p = _load_vector_json(os.path.join(_pkg_dir(), "vectors", d, "prompt.json"),
                                    f"{d}/prompt.json")
              got = sum(len(g["tests"]) for g in p["testGroups"])
              assert got == want, (mode, got)
              n += got
          print("SLH-DSA signature vectors present:", n, "from",
                _vector_revision("SLH-DSA-sigVer-FIPS205"))
          PY
      - name: The wheel must carry the LMS/XMSS vectors
        run: |
          /tmp/fresh/bin/python - <<'PY'
          from pq_verify.hbs_suite import pqverify_hbs, pqverify_lms_acvp
          r = pqverify_lms_acvp(verbose=False)
          assert (r["passed"], r["total"]) == (87, 87), r
          r = pqverify_hbs(budget=0, verbose=False)
          assert r["verified"] and r["total"] == 1441, (r["passed"], r["total"])
          print("LMS/XMSS vectors present:", r["vectors"])
          PY
      - name: The wheel must carry the FN-DSA vectors
        run: |
          /tmp/fresh/bin/python - <<'PY'
          from pq_verify.fndsa import pqverify_fndsa
          r = pqverify_fndsa(verbose=False)
          assert r["verified"] and r["total"] == 188, (r["passed"], r["total"])
          print("FN-DSA vectors present (draft track):", r["vectors"])
          PY
      - name: The wheel must carry the Classic McEliece KATs
        run: |
          /tmp/fresh/bin/python - <<'PY'
          from pq_verify.mceliece import pqverify_mceliece
          r = pqverify_mceliece(verbose=False, sets=("mceliece348864",))
          assert r["verified"] and r["total"] == 10, (r["passed"], r["total"])
          print("Classic McEliece KATs present (not FIPS):", r["vectors"])
          PY
      - name: The wheel must carry the HQC manifest
        run: |
          /tmp/fresh/bin/python - <<'PY'
          from pq_verify.hqc import pqverify_hqc
          r = pqverify_hqc(verbose=False, sets=("HQC-1",), profiles=("v5",))
          assert r["verified"] and r["total"] == 11, (r["passed"], r["total"])
          print("HQC manifest present (standard not final):", r["vectors"])
          PY
      - name: The wheel must carry the hybrid module
        run: |
          /tmp/fresh/bin/pq-verify --emit-hybrid-prompt list | tee /tmp/groups.txt
          grep -q "0x11EC  X25519MLKEM768" /tmp/groups.txt
