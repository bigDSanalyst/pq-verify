name: Workflow security (zizmor)

# Static analysis of this repository's GitHub Actions: every action pinned to
# a commit, no token left on disk after checkout, nothing an outsider controls
# expanded into a script, no cache a release could restore. Any finding fails.
# The online audits (impostor commits, known-vulnerable actions) read public
# data with the read-only token.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install zizmor==1.31.1
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain .
