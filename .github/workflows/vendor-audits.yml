name: Vendor audits (pinned)

# Rebuilds every third-party ML-KEM, ML-DSA, LMS/HSS, XMSS and FN-DSA (draft)
# library in tools/vendor_audits.json at its pinned commit and re-runs
# --audit-kem / --audit-dsa / --audit-hbs / --audit-fndsa / --audit-mceliece against the pinned vectors. Every input is
# pinned, so a failure means pq-verify's own behaviour changed. Each row's
# mutants (one planted bug each) must FAIL the audit; one that passes is a
# bug class pq-verify cannot see.
#
# liboqs is built once (CMake, OQS_DIST_BUILD, as distributions ship it) and
# audited per implementation: its public OQS_* API and each backend behind
# it. Its mutants sit on the x86-64 code path, which the runner's CPU
# (AVX2/BMI2) takes; on a CPU without it they would be reported MISSED.
#
# Runs on changes to the code that decides audit results, and weekly so a
# toolchain or runner change that alters a result is noticed too.

on:
  pull_request:
    paths:
      - "pq_verify/**"
      - "tools/vendor_audit.py"
      - "tools/vendor_audits.json"
      - "tools/harness_audit.py"
      - "tools/harness_audits.json"
      - "tests/data/crucible_ref_harness.py"
      - "tests/data/mldsa_shim.c"
      - "tests/data/hbs_shim.c"
      - "tests/data/fndsa_shim.c"
      - "tests/data/mceliece_shim.c"
      - "tests/data/oqs_mldsa_shim.c"
      - "constraints-reference.txt"
      - ".github/workflows/vendor-audits.yml"
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

# The runner image is pinned, not ubuntu-latest: these pinned results depend on
# the toolchain that builds each library (gcc, OpenSSL). Moving to a new image
# is a deliberate change in its own PR, re-recording any row that moves.

jobs:
  audit:
    name: vendor audits (pinned libraries)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System dependencies
        # hash-sigs and xmss-reference hash with OpenSSL; valgrind runs the
        # ML-KEM rows' constant-time stages; CMake builds liboqs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev valgrind cmake
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-reference.txt .
      - name: Rebuild each pinned library and re-audit it
        run: python tools/vendor_audit.py

  harness:
    name: harness audits (Crucible protocol, pinned)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-reference.txt .
      - name: Rebuild Crucible's harnesses at the pinned commit and re-audit through them
        run: python tools/harness_audit.py
