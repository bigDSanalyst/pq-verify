name: Vendor audits (pinned)

# Rebuilds every third-party ML-KEM, ML-DSA, LMS/HSS, XMSS and FN-DSA (draft)
# library in tools/vendor_audits.json at its pinned commit and re-runs
# --audit-kem / --audit-dsa / --audit-hbs / --audit-fndsa / --audit-mceliece / --audit-hqc
# against the pinned vectors. Every input is
# pinned, so a failure means pq-verify's own behaviour changed. Each row's
# mutants (one planted bug each) must FAIL the audit; one that passes is a
# bug class pq-verify cannot see.
#
# liboqs is built once (CMake, OQS_DIST_BUILD, as distributions ship it) and
# audited per implementation: its public OQS_* API and each backend behind
# it. Its mutants sit on the x86-64 code path, which the runner's CPU
# (AVX2/BMI2) takes; on a CPU without it they would be reported MISSED.
#
# The source jobs prove PQClean's ML-KEM and ML-DSA arithmetic with
# --audit-source (CBMC and exhaustive checks, tools/source_audit.py) at the
# same pinned commit, one job per scheme, and require each of its mutants to
# be caught.
#
# Runs on changes to the code that decides audit results, and weekly so a
# toolchain or runner change that alters a result is noticed too.

on:
  pull_request:
    paths:
      - "pq_verify/**"
      - "tools/vendor_audit.py"
      - "tools/vendor_audits.json"
      - "tools/harness_audit.py"
      - "tools/harness_audits.json"
      - "tools/source_audit.py"
      - "tests/data/crucible_ref_harness.py"
      - "tests/data/mldsa_shim.c"
      - "tests/data/hbs_shim.c"
      - "tests/data/fndsa_shim.c"
      - "tests/data/mceliece_shim.c"
      - "tests/data/hqc_shim.c"
      - "tests/data/oqs_mldsa_shim.c"
      - "constraints-reference.txt"
      - ".github/workflows/vendor-audits.yml"
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to the same pull request supersedes a run; main and the weekly
# run each finish.
concurrency:
  group: vendor-audits-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner image is pinned, not ubuntu-latest: these pinned results depend on
# the toolchain that builds each library (gcc, OpenSSL). Moving to a new image
# is a deliberate change in its own PR, re-recording any row that moves.

jobs:
  audit:
    name: vendor audits (pinned libraries)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: System dependencies
        # hash-sigs and xmss-reference hash with OpenSSL; valgrind runs the
        # ML-KEM, ML-DSA and Classic McEliece rows' constant-time stages;
        # CMake builds liboqs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev valgrind cmake
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-reference.txt .
      - name: Rebuild each pinned library and re-audit it
        run: python tools/vendor_audit.py

  harness:
    name: harness audits (Crucible protocol, pinned)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.1"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-reference.txt .
      - name: Rebuild Crucible's harnesses at the pinned commit and re-audit through them
        run: python tools/harness_audit.py

  source:
    name: source audit (CBMC, pinned PQClean, ${{ matrix.scheme }} ${{ matrix.sets }})
    runs-on: ubuntu-24.04
    # An ML-DSA parameter set took 23 minutes on a 4-core machine, and its 12
    # mutants 13 more; each set is its own job, the mutants with ML-DSA-65's
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scheme: ml-kem, sets: "512,768,1024", mutants: "yes"}
          - {scheme: ml-dsa, sets: "65", mutants: "yes"}
          - {scheme: ml-dsa, sets: "44", mutants: "no"}
          - {scheme: ml-dsa, sets: "87", mutants: "no"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: System dependencies
        # CBMC proves the arithmetic; Z3 proves ML-DSA's montgomery_reduce
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cbmc z3
      - name: Kissat, built at its pinned commit
        # Kissat solves the NTT proofs. Ubuntu does not package it, so it is
        # built here from the commit of its 4.0.4 release.
        env:
          KISSAT_COMMIT: 8af8e56f174b778aef3aa45af9f739b2a5f492c2
        run: |
          git init -q "$RUNNER_TEMP/kissat"
          cd "$RUNNER_TEMP/kissat"
          git fetch -q --depth 1 https://github.com/arminbiere/kissat.git "$KISSAT_COMMIT"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$KISSAT_COMMIT"
          ./configure > /dev/null && make -j"$(nproc)" > /dev/null
          sudo install -m 0755 build/kissat /usr/local/bin/kissat
          kissat --version
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-reference.txt .
      - name: Prove PQClean's arithmetic for the sets, and catch each mutant
        env:
          SCHEME: ${{ matrix.scheme }}
          SETS: ${{ matrix.sets }}
          MUTANTS: ${{ matrix.mutants }}
        run: |
          if [ "$MUTANTS" = "yes" ]; then extra=""; else extra="--no-mutants"; fi
          python tools/source_audit.py --scheme "$SCHEME" --sets "$SETS" $extra
