name: Watch NIST ACVP vectors

# Tells the maintainer when NIST changes the upstream ACVP vectors, so a new
# pinned snapshot can be cut deliberately. Does NOT modify the shipped bundle.
#
# Runs weekly (and on manual trigger). On change: updates the tracked baseline
# and opens an issue with the diff.

on:
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC every Monday
  workflow_dispatch: {}    # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write          # to commit the updated baseline
  issues: write            # to open an issue on change

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check NIST vectors for drift
        id: check
        run: |
          set +e
          OUT=$(python3 tools/check_vectors.py)
          CODE=$?
          echo "$OUT"
          # save output for the issue body
          {
            echo 'report<<EOF'
            echo "$OUT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit updated baseline (if changed)
        if: steps.check.outputs.code == '1'
        run: |
          git config user.name  "vector-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add tools/vector_state/
          git commit -m "watcher: NIST ACVP vectors changed upstream" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Open an issue (if changed)
        if: steps.check.outputs.code == '1'
        uses: actions/github-script@v9
        with:
          script: |
            const body = `A scheduled check detected that NIST's ACVP vectors changed upstream.

            \`\`\`
            ${{ steps.check.outputs.report }}
            \`\`\`

            **This does not change the shipped frozen vectors.** pq-verify stays
            deterministic. Action for the maintainer:

            1. Run the doctor against NIST's current files. It writes nothing:
               \`python3 tools/doctor.py --candidate\`
            2. Read its verdict. Any BLOCK means do not pin; DECIDE on
               \`stable\` means wait (NIST has reverted these files within a day).
            3. When it is all ok: \`python3 tools/doctor.py --candidate --apply\`
            4. Record the revisions and release, as in REPINNING.md.`;
            // A stale bundle re-reports every week until it is re-pinned;
            // keep that to one open issue with a comment per run.
            const title = "NIST ACVP vectors changed upstream — review before re-pinning";
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "vectors",
            });
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["upstream", "vectors"],
              });
            }

      - name: Report clean
        if: steps.check.outputs.code == '0'
        run: echo "No upstream change. Pinned vectors remain current."
